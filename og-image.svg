  <rect width="1200" height="630" fill="url(#paper)"/>
  <circle cx="180" cy="90" r="220" fill="#c45c26" opacity="0.06"/>
  <circle cx="1020" cy="560" r="260" fill="#2f5d50" opacity="0.07"/>

  <text x="88" y="250" fill="#c45c26" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" letter-spacing="6">KLASSEN 1 BIS 6</text>
  <text x="84" y="360" fill="#1c2430" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="700">Mathematik</text>
  <text x="84" y="455" fill="#1c2430" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="700">Uebungsaufgaben</text>
  <text x="88" y="530" fill="#5b6573" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600">Kostenlos ueben · PDF · Zeitlimit · Bestzeiten</text>

  <g transform="translate(900 315)" filter="url(#shadow)">
