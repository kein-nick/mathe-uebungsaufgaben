<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Mathematik Uebungsaufgaben">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#efe6d4"/>
      <stop offset="45%" stop-color="#f6f1e6"/>
      <stop offset="100%" stop-color="#fffdf8"/>
    </linearGradient>
    <linearGradient id="icon-bg" x1="900" y1="120" x2="1080" y2="510" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4aa894"/>
      <stop offset="55%" stop-color="#2f6f62"/>
      <stop offset="100%" stop-color="#1a4038"/>
    </linearGradient>
    <linearGradient id="icon-key" x1="990" y1="220" x2="990" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#efe6d4"/>
    </linearGradient>
    <linearGradient id="icon-plus" x1="930" y1="270" x2="1050" y2="360" gradientUnits="userSpaceOnUse">
