      <stop offset="100%" stop-color="#c45c26"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#1c2430" flood-opacity="0.12"/>
    </filter>
