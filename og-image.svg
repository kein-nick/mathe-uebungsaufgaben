    <ellipse cx="-35" cy="-70" rx="55" ry="22" fill="#ffffff" opacity="0.14"/>
    <rect x="-72" y="-48" width="144" height="112" rx="32" fill="url(#icon-key)"/>
    <g transform="rotate(-4)">
